<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | FindIt</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="auth-page">
    <a class="logo" href="index.html">Find<span>It</span></a>

    <section class="auth-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to manage your lost and found reports.</p>

      <form id="login-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button type="submit">Log in</button>
      </form>

      <p class="switch-page">Don’t have an account? <a href="register.html">Create one</a></p>
      <p class="switch-page"><a href="index.html">Back to home</a></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
